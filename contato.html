<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Orçamento — CasaDigitalRP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="assets/img/logo.jpeg" alt="Logo CasaDigitalRP">
                <div class="brand-text">
                    <h1>CasaDigitalRP</h1>
                    <span>— sempre com você —</span>
                </div>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="portfolio.html">Portfólio</a></li>
                    <li><a href="contato.html" class="cta-nav active">Orçamento IA</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">Solicitação de Orçamento e Diagnóstico</h1>
                <p style="font-size: 14px; color: var(--text-muted);">Preencha os dados abaixo para receber uma estimativa técnica preliminar em instantes.</p>
            </div>

            <form id="budgetForm">
                <div class="form-group">
                    <label for="nome">Nome Completo <span>*</span></label>
                    <input type="text" id="nome" name="Nome Completo" required placeholder="Ex: Carlos Eduardo">
                </div>

                <div class="form-group">
                    <label for="email">E-mail Corporativo <span>*</span></label>
                    <input type="email" id="email" name="E-mail Corporativo" required placeholder="Ex: carlos@suaempresa.com.br">
                </div>

                <div class="form-group">
                    <label for="empresa">Nome da Empresa <span>*</span></label>
                    <input type="text" id="empresa" name="Nome da Empresa" required placeholder="Ex: Inova Soluções Ltda">
                </div>

                <div class="form-group">
                    <label for="telefone">WhatsApp / Telefone</label>
                    <input type="text" id="telefone" name="WhatsApp / Telefone" placeholder="Ex: (16) 99999-9999">
                </div>

                <div class="form-group">
                    <label for="solucao">Solução de Interesse <span>*</span></label>
                    <select id="solucao" name="Solução de Interesse" required>
                        <option value="" disabled selected>Selecione uma solução do catálogo...</option>
                        <option value="Atendente Inteligente WhatsApp / Telegram">Atendente Inteligente WhatsApp / Telegram</option>
                        <option value="Leitor Automático de Notas e Comprovantes (OCR)">Leitor Automático de Notas e Comprovantes (OCR)</option>
                        <option value="Enriquecimento Cadastral Automático com BrasilAPI">Enriquecimento Cadastral Automático com BrasilAPI</option>
                        <option value="Régua de Cobrança e Lembretes Preventivos">Régua de Cobrança e Lembretes Preventivos</option>
                        <option value="Central de Relatórios e Alertas Executivos no Telegram/Discord">Central de Relatórios e Alertas Executivos no Telegram/Discord</option>
                        <option value="Consultoria e Desenvolvimento de Fluxos n8n Sob Medida">Consultoria e Desenvolvimento de Fluxos n8n Sob Medida</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gargalo">Qual o maior gargalo operacional do seu negócio hoje? <span>*</span></label>
                    <textarea id="gargalo" name="Qual o maior gargalo operacional do seu negócio hoje?" required placeholder="Descreva brevemente os processos manuais ou desafios que deseja automatizar..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Solicitar Proposta e Diagnóstico</button>

                <div id="feedback" class="feedback-message"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CasaDigitalRP. Todos os direitos reservados. — sempre com você —</p>
    </footer>

    <script src="js/contact.js"></script>
</body>
</html>
